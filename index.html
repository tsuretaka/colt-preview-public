<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COLT 遠隔レビュー接続テスト</title>
<style>
body{margin:0;padding:32px 20px;background:#eef3f7;color:#182d42;font-family:system-ui,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;background:white;padding:36px;border-radius:20px}
.label{font-size:12px;color:#536d86;letter-spacing:2px}
h1{font-size:30px;line-height:1.3;margin:12px 0 24px}
.card{padding:28px;background:#184c80;color:white;border-radius:14px;margin:24px 0}
.card h2{margin:0 0 12px;font-size:22px}
.card p{margin:0}
.pill{display:inline-block;padding:4px 12px;border-radius:18px;background:#dcebf8;color:#184c80;font-size:12px}
table{width:100%;border-collapse:collapse;margin:24px 0;font-size:14px}
th,td{text-align:left;border-bottom:1px solid #dce5ed;padding:12px 0}
th{color:#536d86;font-weight:500;width:40%}
.note{font-size:13px;color:#536d86}
</style>
</head>
<body><main>
<p class="label">COLT / REMOTE REVIEW TEST</p>
<h1 id="preview-ready">どこからでも、同じデザイン案を確認。</h1>
<span class="pill">検証用デザイン案 · Revision A</span>
<section class="card"><h2>MacBookとiPhoneで見え方を確認</h2><p>青いカードの配色、余白、角丸と文字の読みやすさを確認するための、業務情報を含まないサンプルです。</p></section>
<table id="review-details"><tr><th>確認すること</th><td>固定URL・保存内容・成果物hashの対応</td></tr><tr><th>表示の対象</th><td>自己完結HTMLとインラインCSS</td></tr><tr><th>含まれる情報</th><td>接続テスト用の文章のみ</td></tr><tr><th>公開操作</th><td>本番公開には接続しません</td></tr></table>
<p><a href="#review-details">確認項目を見る</a></p>
<p class="note">これは検証用のデザイン案です。業務上の承認や実案件の本番公開を意味しません。</p>
</main></body>
</html>
